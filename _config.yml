# theme: just-the-docs/just-the-docs
remote_theme: just-the-docs/just-the-docs
title: "DeangL 的笔记本"
description: "数学、物理、金融、计算机学习笔记"
plugins:
  - jekyll-remote-theme
  - jekyll-relative-links
  # - jekyll-paginate
  # - jekyll-sitemap  
relative_links:
  enabled: true
  collections: true

# Conversion
markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false


# Markdown Processing
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false
  parse_block_html: true


category-list: [数学,金融,物理,计算机]  
